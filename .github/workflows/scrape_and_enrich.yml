name: Automated UK Companies House Scraper & Enricher

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  schedule:
    # Runs every 4 hours automatically to process the 5,000 dataset in batches
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of companies to scrape in this run (0 for all)'
        required: false
        default: '50'

permissions:
  contents: write

jobs:
  scrape-and-enrich:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Contact Scraper & Enricher
        run: |
          BATCH="${{ github.event.inputs.batch_size || '50' }}"
          echo "Starting batch run with size: $BATCH"
          python scraper.py --batch-size "$BATCH" --delay 1.0

      - name: 💾 Commit and Push Enriched Leads & Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add enriched_uk_companies.csv enriched_uk_companies.json checkpoint.json scraper.log || true
          
          # Only commit if there are actual new changes
          if git diff --staged --quiet; then
            echo "No new changes to commit in this batch."
          else
            git commit -m "Auto-enrich: appended fresh company contacts $(date +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin main
          fi

      - name: 📑 Upload Execution Logs as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-execution-log
          path: scraper.log
          retention-days: 30
